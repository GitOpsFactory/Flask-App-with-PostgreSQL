apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-app
        image: bkuslapur/python-postgres-app:v2
        imagePullPolicy: Always

        env:
        - name: DB_HOST
          value: postgres

        - name: DB_NAME
          value: mydb

        - name: DB_USER
          value: postgres

        - name: DB_PASS
          value: password

        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service

metadata:
  name: python-service

spec:
  type: NodePort

  selector:
    app: python-app

  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30007